# Nodewave additions to the broker (installed to /etc/mosquitto/conf.d/).
# mosquitto.conf keeps: listener 1883, password_file, allow_anonymous false.
acl_file /etc/mosquitto/acl

# Log who connects, so monitoring can show devices coming and going
connection_messages true
log_timestamp_format %Y-%m-%dT%H:%M:%S
log_type error
log_type warning
log_type notice
log_type information

# WebSockets for browser apps, local only: nginx serves it as
# wss://mqtt-ws.nodewave.dev/mqtt (see README).
listener 9083 127.0.0.1
protocol websockets

# TLS for devices and remote apps: mqtts://mqtt.nodewave.dev:8883.
# Enabled by ./install.sh once the certificate exists (needs the DNS record).
#TLS listener 8883
#TLS certfile /etc/mosquitto/certs/mqtt.nodewave.dev/fullchain.pem
#TLS keyfile /etc/mosquitto/certs/mqtt.nodewave.dev/privkey.pem
#TLS tls_version tlsv1.2
